<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="3" seed="17" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncR type="linear" slope="0.48" intercept="0"/>
      <feFuncG type="linear" slope="0.48" intercept="0"/>
      <feFuncB type="linear" slope="0.48" intercept="0"/>
      <feFuncA type="table" tableValues="0 0.42"/>
    </feComponentTransfer>
  </filter>
  <rect width="240" height="240" filter="url(#grain)"/>
</svg>
